# Facet Docker Image Build & Publish
# 
# Builds and publishes multi-architecture Docker images to GitHub Container Registry.
# Uses native ARM runners for faster arm64 builds (no QEMU emulation).
#
# Triggers on:
#   - Version tags (v1.0.0 publishes as :1.0.0, :1.0, :1, :latest)
#   - Feature branches (for testing)
#   - Manual dispatch (workflow_dispatch)
#
# Images are published to: ghcr.io/jesposito/facet

name: Build and Publish Docker Image

on:
  push:
    branches:
      # Note: 'main' removed - release builds happen on version tags only
      # This ensures the changelog is included (generated before tag)
      - 'upgrade/*'
      - 'claude/*'
      - 'auto-claude/*'
      - 'feature/*'
      - 'feat/*'
      - 'dev/*'
      - 'fix/*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: boolean
  # Called by auto-tag workflow after changelog is committed
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to build (e.g., v2.15.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jesposito/facet

jobs:
  # =========================================
  # Build per-architecture images in parallel
  # =========================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}
    
    permissions:
      contents: read
      packages: write

    outputs:
      # Pass digests to merge job
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # When called via workflow_call, checkout the specific tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Get version from git
        id: version
        run: echo "FACET_VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Get cache key from CHANGELOG and migrations
        id: changelog
        run: |
          # Include both CHANGELOG and migrations directory in cache key
          # This ensures migrations changes always trigger fresh builds
          CHANGELOG_HASH=$(sha256sum CHANGELOG.md | cut -c1-8)
          MIGRATIONS_HASH=$(find backend/migrations -name '*.go' -exec sha256sum {} \; | sha256sum | cut -c1-8)
          echo "hash=${CHANGELOG_HASH}-${MIGRATIONS_HASH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || inputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only generate labels, tags are handled in merge job
          tags: |
            type=raw,value=build-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=Facet
            org.opencontainers.image.description=Self-hosted personal profile platform
            org.opencontainers.image.vendor=jesposito
            org.opencontainers.image.documentation=https://github.com/jesposito/Facet/blob/main/docs/SETUP.md

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' || inputs.tag != '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FACET_VERSION=${{ steps.version.outputs.FACET_VERSION }}
          cache-from: type=gha,scope=build-${{ matrix.suffix }}-${{ steps.changelog.outputs.hash }}
          cache-to: type=gha,scope=build-${{ matrix.suffix }}-${{ steps.changelog.outputs.hash }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' || inputs.tag != '' }}

      - name: Export digest
        if: github.event_name != 'pull_request' || inputs.tag != ''
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' || inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # =========================================
  # Merge architectures into multi-arch manifest
  # =========================================
  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || inputs.tag != ''
    needs: build
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from tag input
        id: parse_version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Strip 'v' prefix and parse semver parts
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For workflow_call: use the parsed version tags
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=${{ steps.parse_version.outputs.version }},enable=${{ inputs.tag != '' }}
            type=raw,value=${{ steps.parse_version.outputs.major_minor }},enable=${{ inputs.tag != '' }}
            type=raw,value=${{ steps.parse_version.outputs.major }},enable=${{ inputs.tag != '' }}
            # Set latest tag for version tags (releases) - direct push
            type=raw,value=latest,enable=${{ inputs.tag == '' && startsWith(github.ref, 'refs/tags/v') }}
            # Dev tag for upgrade, claude, auto-claude, feature, feat, dev, and fix branches
            type=raw,value=dev,enable=${{ inputs.tag == '' && (startsWith(github.ref, 'refs/heads/upgrade/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/auto-claude/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/dev/') || startsWith(github.ref, 'refs/heads/fix/')) }}
            # Branch name (e.g., feature/foo)
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            # Tag name (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}},enable=${{ inputs.tag == '' }}
            # Major.minor (e.g., v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag == '' }}
            # Major only (e.g., v1.0.0 -> 1)
            type=semver,pattern={{major}},enable=${{ inputs.tag == '' }}
            # Git short SHA
            type=sha,prefix=sha-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Attestation skipped - optional feature that was causing build failures

      # =========================================
      # Summary
      # =========================================
      - name: Output image details
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architectures" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64 (native build)" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64 (native build)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
