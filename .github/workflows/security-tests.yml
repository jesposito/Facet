name: Security and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:
    inputs:
      scan_published_image:
        description: Scan the currently published image (disable for release commit validation)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Release validation regression tests
        run: python3 scripts/ci/test-push-validated-release.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libmupdf-dev
      - name: Backend regression tests
        working-directory: backend
        run: go test ./...
      - name: Reachable Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Proxy tests and reachable vulnerabilities
        working-directory: docker/caddy
        run: |
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: Frontend checks and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libmupdf-dev
      - run: npm ci
        working-directory: frontend
      - name: Dependency audit and local mitigation regression tests
        working-directory: frontend
        run: |
          npm audit --audit-level=low
          npm run test:dependencies
      - name: Svelte checks and production build
        working-directory: frontend
        run: |
          npm run check
          npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Fresh database and built-app browser smoke tests
        run: bash scripts/ci/run-browser-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            frontend/test-results
            /tmp/facet-smoke-*/logs

  published-image:
    name: Published image vulnerability scan
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan_published_image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan the currently published image for fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/jesposito/facet:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
