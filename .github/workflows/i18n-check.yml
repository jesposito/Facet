name: i18n Validation

on:
  pull_request:
    paths:
      - 'frontend/src/locales/**'
      - 'frontend/src/lib/i18n/**'
      - 'frontend/src/**/*.svelte'
      - 'frontend/src/**/*.ts'
      - 'frontend/package.json'
      - 'scripts/validate-translations.js'
      - 'scripts/check-i18n-values-params.mjs'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate translation files
        run: node scripts/validate-translations.js --ci

      - name: Check translation interpolation callsites
        run: node scripts/check-i18n-values-params.mjs
