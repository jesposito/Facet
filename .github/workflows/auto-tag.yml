# Auto-tag on merge to main
#
# Automatically creates a version tag when a PR is merged to main.
# Uses conventional commit prefixes to determine version bump:
#   - feat: -> minor bump (v1.0.0 -> v1.1.0)
#   - fix: -> patch bump (v1.0.0 -> v1.0.1)
#   - BREAKING CHANGE or !: -> major bump (v1.0.0 -> v2.0.0)
#
# Can also be triggered manually with explicit version type.

name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tag:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags
          fetch-tags: true

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest semver tag
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "latest=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine bump type
        id: bump_type
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            BUMP="$MANUAL_BUMP"
          else
            # Check for breaking change
            if echo "$PR_TITLE" | grep -qiE '^.*!:|BREAKING CHANGE'; then
              BUMP="major"
            # Check for feature
            elif echo "$PR_TITLE" | grep -qiE '^feat'; then
              BUMP="minor"
            # Default to patch for fixes and others
            else
              BUMP="patch"
            fi
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST="${{ steps.get_tag.outputs.latest }}"
          BUMP="${{ steps.bump_type.outputs.bump }}"
          
          # Remove 'v' prefix and split into parts
          VERSION=${LATEST#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG"

      - name: Update CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.new_version.outputs.new_tag }}
          PREV_TAG: ${{ steps.get_tag.outputs.latest }}
          REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Configure git for commits
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up any previous temp files
          rm -f /tmp/bugs.txt /tmp/features.txt /tmp/other.txt /tmp/pr_links.txt /tmp/pr_data.json

          # Get the date of the previous tag (or initial commit if no tags)
          if [ "$PREV_TAG" == "v0.0.0" ]; then
            SINCE_DATE=$(git log --reverse --format=%aI | head -1)
          else
            SINCE_DATE=$(git log -1 --format=%aI "$PREV_TAG" 2>/dev/null || git log --reverse --format=%aI | head -1)
          fi

          echo "Fetching PRs merged since: $SINCE_DATE"

          # Fetch merged PRs since previous tag (include body for AI context)
          PRS=$(gh pr list --state merged --base main --search "merged:>=$SINCE_DATE" --json number,title,url,body --limit 100)
          echo "$PRS" > /tmp/pr_data.json

          # Extract PR numbers already documented in changelog to avoid duplicates
          EXISTING_PRS=$(grep -oE '\[#[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+' | sort -u | tr '\n' ' ')
          echo "Already documented PRs: $EXISTING_PRS"

          # Filter out already-documented PRs
          if [ -n "$EXISTING_PRS" ]; then
            FILTERED_PRS=$(echo "$PRS" | jq --arg existing "$EXISTING_PRS" '
              [.[] | select(.number as $n | ($existing | split(" ") | map(select(. != "")) | map(tonumber)) | index($n) | not)]
            ')
          else
            FILTERED_PRS="$PRS"
          fi

          PR_COUNT=$(echo "$FILTERED_PRS" | jq 'length')
          echo "New PRs to document: $PR_COUNT"

          # Try AI-powered changelog generation
          # Priority: 1) GitHub Models (Copilot), 2) OpenAI API, 3) Keyword fallback
          AI_SUCCESS=false
          AI_SOURCE=""

          # Build prompt with PR data (using filtered list)
          PR_LIST=$(echo "$FILTERED_PRS" | jq -r '.[] | "PR #\(.number): \(.title)\nDescription: \(.body // "No description")\n---"')

          # Get recent changelog entries for AI context (helps avoid semantic duplicates)
          RECENT_CHANGELOG=$(head -50 CHANGELOG.md | tail -45)

          # Read prompt template from file (avoids YAML parsing issues)
          PROMPT_TEMPLATE=$(cat .github/prompts/changelog-prompt.txt)
          PROMPT=$(printf '%s\n\nRecent changelog (DO NOT duplicate these entries):\n%s\n\nNew PRs to document:\n%s\n\nOutput only valid JSON, no markdown or explanation.' "$PROMPT_TEMPLATE" "$RECENT_CHANGELOG" "$PR_LIST")

          # Try GitHub Models (Copilot) first - uses GITHUB_TOKEN
          echo "Trying GitHub Models (Copilot)..."
          GH_MODELS_RESPONSE=$(curl -s --connect-timeout 10 --max-time 60 "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -d "$(jq -n --arg prompt "$PROMPT" '{
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": $prompt}],
              "temperature": 0.3,
              "max_tokens": 2000
            }')" 2>/dev/null)

          GH_CONTENT=$(echo "$GH_MODELS_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)

          if [ -n "$GH_CONTENT" ] && [ "$GH_CONTENT" != "null" ]; then
            AI_JSON=$(echo "$GH_CONTENT" | sed 's/^```json//; s/^```//; s/```$//' | jq '.' 2>/dev/null)
            if [ -n "$AI_JSON" ]; then
              echo "GitHub Models (Copilot) categorization successful"
              AI_SUCCESS=true
              AI_SOURCE="GitHub Copilot"
            fi
          fi

          # Fallback to OpenAI if GitHub Models failed and API key is available
          if [ "$AI_SUCCESS" = false ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "Trying OpenAI API..."
            AI_RESPONSE=$(curl -s --connect-timeout 10 --max-time 60 https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "$(jq -n --arg prompt "$PROMPT" '{
                "model": "gpt-4o-mini",
                "messages": [{"role": "user", "content": $prompt}],
                "temperature": 0.3,
                "max_tokens": 2000
              }')" 2>/dev/null)

            AI_CONTENT=$(echo "$AI_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)

            if [ -n "$AI_CONTENT" ]; then
              AI_JSON=$(echo "$AI_CONTENT" | sed 's/^```json//; s/^```//; s/```$//' | jq '.' 2>/dev/null)
              if [ -n "$AI_JSON" ]; then
                echo "OpenAI categorization successful"
                AI_SUCCESS=true
                AI_SOURCE="OpenAI"
              fi
            fi
          fi

          # Process AI response if successful
          if [ "$AI_SUCCESS" = true ]; then
            # Get list of valid PR numbers from input data
            VALID_PRS=$(echo "$FILTERED_PRS" | jq -r '.[].number' | sort -u | tr '\n' ' ')
            echo "Valid PR numbers: $VALID_PRS"

            # Filter AI response to only include valid PR numbers (reject hallucinated ones)
            VALIDATED_JSON=$(echo "$AI_JSON" | jq --arg valid "$VALID_PRS" '
              [.[] | select(.number as $n | ($valid | split(" ") | map(select(. != "")) | map(tonumber)) | index($n))]
            ')
            REJECTED_COUNT=$(echo "$AI_JSON" | jq --arg valid "$VALID_PRS" '
              [.[] | select(.number as $n | ($valid | split(" ") | map(select(. != "")) | map(tonumber)) | index($n) | not)] | length
            ')
            if [ "$REJECTED_COUNT" -gt 0 ]; then
              echo "WARNING: Rejected $REJECTED_COUNT entries with fabricated PR numbers"
            fi

            echo "$VALIDATED_JSON" | jq -c '.[]' | while read -r item; do
              NUMBER=$(echo "$item" | jq -r '.number')
              CATEGORY=$(echo "$item" | jq -r '.category')
              DESC=$(echo "$item" | jq -r '.description')

              case "$CATEGORY" in
                BUG) echo "$DESC" >> /tmp/bugs.txt ;;
                FEATURE) echo "$DESC" >> /tmp/features.txt ;;
                *) echo "$DESC" >> /tmp/other.txt ;;
              esac
            done

            # Add unique PR links (deduplicated, only for validated entries)
            echo "$VALIDATED_JSON" | jq -r '.[].number' | sort -u | while read -r NUMBER; do
              URL=$(echo "$PRS" | jq -r ".[] | select(.number == $NUMBER) | .url")
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                echo "[#$NUMBER]($URL)" >> /tmp/pr_links.txt
              fi
            done
          fi

          # Fallback to keyword-based categorization if AI failed
          if [ "$AI_SUCCESS" = false ]; then
            echo "Using keyword-based categorization..."

            echo "$FILTERED_PRS" | jq -c '.[]' | while read -r pr; do
              [ -z "$pr" ] && continue
              NUMBER=$(echo "$pr" | jq -r '.number')
              TITLE=$(echo "$pr" | jq -r '.title')
              URL=$(echo "$pr" | jq -r '.url')

              # Clean title
              CLEAN_TITLE=$(echo "$TITLE" | sed -E 's/^(feat|fix|docs|refactor|chore|style|test|perf|ci|build)(\([^)]*\))?[!]?:\s*//i')
              CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed -E 's/^Claude\/[^:]*:\s*//i')
              CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed -E 's/^Claude\/\s*//i')

              TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')

              if echo "$TITLE_LOWER" | grep -qE '^fix(\([^)]*\))?[!]?:'; then
                echo "$CLEAN_TITLE" >> /tmp/bugs.txt
              elif echo "$TITLE_LOWER" | grep -qE '^feat(ure)?(\([^)]*\))?[!]?:'; then
                echo "$CLEAN_TITLE" >> /tmp/features.txt
              elif echo "$TITLE_LOWER" | grep -qE '(fix|bug|resolve|patch|hotfix)'; then
                echo "$CLEAN_TITLE" >> /tmp/bugs.txt
              elif echo "$TITLE_LOWER" | grep -qE '(add|implement|new feature|introduce|create|enable)'; then
                echo "$CLEAN_TITLE" >> /tmp/features.txt
              else
                echo "$CLEAN_TITLE" >> /tmp/other.txt
              fi
              echo "[#$NUMBER]($URL)" >> /tmp/pr_links.txt
            done
          fi

          # Format the date nicely
          RELEASE_DATE=$(date '+%B %d, %Y')

          # Build the changelog entry
          ENTRY_FILE=/tmp/changelog_entry.md
          echo "## $NEW_TAG - $RELEASE_DATE" > "$ENTRY_FILE"
          echo "" >> "$ENTRY_FILE"

          if [ -f /tmp/bugs.txt ] && [ -s /tmp/bugs.txt ]; then
            echo "**Bugs Fixed:**" >> "$ENTRY_FILE"
            while IFS= read -r line; do
              echo "- $line" >> "$ENTRY_FILE"
            done < /tmp/bugs.txt
            echo "" >> "$ENTRY_FILE"
          fi

          if [ -f /tmp/features.txt ] && [ -s /tmp/features.txt ]; then
            echo "**New Features:**" >> "$ENTRY_FILE"
            while IFS= read -r line; do
              echo "- $line" >> "$ENTRY_FILE"
            done < /tmp/features.txt
            echo "" >> "$ENTRY_FILE"
          fi

          if [ -f /tmp/other.txt ] && [ -s /tmp/other.txt ]; then
            echo "**Other Changes:**" >> "$ENTRY_FILE"
            while IFS= read -r line; do
              echo "- $line" >> "$ENTRY_FILE"
            done < /tmp/other.txt
            echo "" >> "$ENTRY_FILE"
          fi

          if [ -f /tmp/pr_links.txt ] && [ -s /tmp/pr_links.txt ]; then
            PR_LINK_LIST=$(cat /tmp/pr_links.txt | tr '\n' ', ' | sed 's/, $//')
            echo "**Pull Requests:** $PR_LINK_LIST" >> "$ENTRY_FILE"
            echo "" >> "$ENTRY_FILE"
          fi

          echo "---" >> "$ENTRY_FILE"
          echo "" >> "$ENTRY_FILE"

          # Create or update CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            {
              head -n 4 CHANGELOG.md
              echo ""
              cat "$ENTRY_FILE"
              tail -n +5 CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to Facet will be documented in this file."
              echo ""
              cat "$ENTRY_FILE"
            } > CHANGELOG.md
          fi

          # Commit and push changelog
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "docs: update CHANGELOG for $NEW_TAG"
            git push origin main
            echo "## Changelog Updated" >> $GITHUB_STEP_SUMMARY
            if [ "$AI_SUCCESS" = true ]; then
              echo "Generated with AI assistance" >> $GITHUB_STEP_SUMMARY
            fi
            echo "CHANGELOG.md has been updated with release notes for $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.new_version.outputs.new_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BUMP_TYPE: ${{ steps.bump_type.outputs.bump }}
          PREV_TAG: ${{ steps.get_tag.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest main to include the changelog commit
          git pull origin main

          # Create annotated tag with PR info (on the changelog commit)
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG (manual trigger)"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG" -m "" -m "PR: #$PR_NUMBER" -m "Title: $PR_TITLE"
          fi

          git push origin "$NEW_TAG"

          echo "## Tag Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**New Tag:** \`$NEW_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** $BUMP_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Tag:** $PREV_TAG" >> $GITHUB_STEP_SUMMARY

      # Tags pushed by GITHUB_TOKEN don't trigger workflows, so manually trigger Docker build
      - name: Trigger Docker build
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.new_version.outputs.new_tag }}
        run: |
          gh workflow run docker-publish.yml --ref "$NEW_TAG"
          echo "## Docker Build Triggered" >> $GITHUB_STEP_SUMMARY
          echo "Triggered Docker build for tag $NEW_TAG" >> $GITHUB_STEP_SUMMARY
