# Facet Development Docker Compose
# Usage: docker compose -f docker-compose.dev.yml up
#
# This configuration uses hash-based caching to skip unnecessary installs.
# Named volumes persist node_modules and Go modules across restarts.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: facet-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app/backend:cached
      - ./scripts:/app/scripts:cached
      - ./.air.toml:/app/.air.toml:cached
      - ./pb_data:/app/pb_data
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    # Published on host loopback only.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - DATA_DIR=/app/pb_data
      # Inside the container, listen on all interfaces so published ports work.
      - FACET_DEV_HOST=0.0.0.0
      # DEV ONLY: This key is for local development. Never use in production.
      # Production requires a unique key: openssl rand -hex 32
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-only-key-do-not-use-in-production!!}
      - SEED_DATA=${SEED_DATA:-dev}  # 'dev' for dev profile, unset for no seeding
      - LOG_LEVEL=debug
    command: /app/scripts/dev-backend.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: node:24-alpine
    container_name: facet-frontend-dev
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend:cached
      - ./scripts:/app/scripts:cached
      - frontend-node-modules:/app/frontend/node_modules
    # Published on host loopback only.
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - FACET_DEV_HOST=0.0.0.0
      # Vite's /api and /_ proxy and SvelteKit server code reach PocketBase
      # by its Compose service name on the shared default network.
      - POCKETBASE_URL=http://backend:8090
    command: sh /app/scripts/dev-frontend.sh
    depends_on:
      backend:
        condition: service_healthy

volumes:
  go-cache:
    name: facet-go-cache
  go-build-cache:
    name: facet-go-build-cache
  frontend-node-modules:
    name: facet-frontend-node-modules
