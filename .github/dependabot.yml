version: 2

# One routine dependency PR across the app, proxy, images, and CI.
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /frontend
    patterns: ['*']
    multi-ecosystem-group: maintenance
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Framework/compiler major migrations need a planned compatibility pass.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Match the supported runtime; update this with .nvmrc and Docker.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # svelte-check 4 does not support the TypeScript 7 compiler API.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: gomod
    directories: [/backend, /docker/caddy]
    patterns: ['*']
    multi-ecosystem-group: maintenance
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /docker
    patterns: ['*']
    multi-ecosystem-group: maintenance
    ignore:
      # Stay on Node 24 LTS; runtime major upgrades are deliberate.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: maintenance
