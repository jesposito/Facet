# Air configuration for running from backend/ directory
# https://github.com/air-verse/air
#
# Use this when running: cd backend && air
# For repo root usage, see ../.air.toml

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/facet"
  cmd = "go build -o ./tmp/facet ."
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # Listens on loopback unless FACET_DEV_HOST names another host or IPv4 address.
  full_bin = 'DATA_DIR=../pb_data ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-only-key-do-not-use-in-production!!} SEED_DATA=${SEED_DATA:-minimal} ./tmp/facet serve --http="${FACET_DEV_HOST:-127.0.0.1}:8090" --dir=../pb_data'
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
