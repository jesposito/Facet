name: Published image security

on:
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: published-image-security
  cancel-in-progress: true

jobs:
  published-image:
    name: Published image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan the currently published image for fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/jesposito/facet:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
