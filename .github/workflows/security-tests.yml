name: Security and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Release validation regression tests
        run: python3 scripts/ci/test-push-validated-release.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install PDF build dependency
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libmupdf-dev
      - name: Backend regression tests
        working-directory: backend
        run: go test ./...
      - name: Reachable Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Proxy tests and reachable vulnerabilities
        working-directory: docker/caddy
        run: |
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: Frontend checks and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install PDF build dependency
        timeout-minutes: 5
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libmupdf-dev
      - run: npm ci
        working-directory: frontend
      - name: Dependency audit and local mitigation regression tests
        working-directory: frontend
        run: |
          npm audit --audit-level=low
          npm run test:dependencies
      - name: Svelte checks and production build
        working-directory: frontend
        run: |
          npm run check
          npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Fresh database and built-app browser smoke tests
        run: bash scripts/ci/run-browser-smoke.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            frontend/test-results
            /tmp/facet-smoke-*/logs
